services:
  codex-repo-updater:
    build: .
    restart: unless-stopped
    init: true
    user: "${REPO_UID:?Set REPO_UID in .env}:${REPO_GID:?Set REPO_GID in .env}"
    environment:
      GPG_KEY: ${GPG_KEY:?Set GPG_KEY in .env}
      MAINTAINER: ${MAINTAINER:?Set MAINTAINER in .env}
      REPO_NAME: ${REPO_NAME:?Set REPO_NAME in .env}
      REPO_DESCRIPTION: ${REPO_DESCRIPTION:?Set REPO_DESCRIPTION in .env}
      REPO_ARCHITECTURES: ${REPO_ARCHITECTURES:?Set REPO_ARCHITECTURES in .env}
      CHECK_INTERVAL: ${CHECK_INTERVAL:?Set CHECK_INTERVAL in .env}
      ARCHES: ${ARCHES:?Set ARCHES in .env}
      CODENAME: ${CODENAME:?Set CODENAME in .env}
    volumes:
      - ${REPO_DATA_DIR:?Set REPO_DATA_DIR in .env}/repo:/repo
      - ${REPO_DATA_DIR:?Set REPO_DATA_DIR in .env}/gnupg:/gnupg
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
